[package]
name = "pointer_replacer"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
points_to = { path = "../points_to" }
itertools = "0.14.0"
petgraph = "0.8.2"
regex = "1.12.2"
anyhow = "1.0"
indexmap = "2.2.6"
cadical = "0.1"
z3 = "0.19.7"
tracing.workspace = true
etrace.workspace = true
typed-arena.workspace = true
serde.workspace = true
# Promoted from dev-dependencies for S2a-H: the reconciliation ARTIFACT is
# shipping code (producer B is not `cfg(test)`, by ruling), so its JSONL
# encoder cannot be test-only. Already a workspace dependency and already
# compiled for this crate's test target, so the promotion costs nothing.
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
similar = "2.7.0"
syn = { version = "2.0.117", features = ["full", "visit"] }

[package.metadata.rust-analyzer]
rustc_private = true
